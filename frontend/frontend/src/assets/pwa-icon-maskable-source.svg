<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161311"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="glyph" x1="128" y1="192" x2="384" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB8A3C"/>
      <stop offset="1" stop-color="#C2440A"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background, no rounded corners of its own — the OS applies
       its own mask shape (circle/squircle/rounded-square) on top of this,
       so the artwork underneath has to extend edge-to-edge. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Same video-camera glyph as the standalone icon, scaled down and
       centered so it stays fully inside the ~80%-diameter safe zone every
       platform's mask respects, instead of risking the lens tip or signal
       arcs getting clipped off on a circular mask. -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <rect x="90" y="176" width="230" height="160" rx="34" fill="url(#glyph)"/>
    <path d="M356 214 L430 172 C438.5 167.1 449 173.2 449 183 V329 C449 338.8 438.5 344.9 430 340 L356 298 Z" fill="url(#glyph)"/>
    <g stroke="#FFB454" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M392 152 A64 64 0 0 1 428 128"/>
      <path d="M372 128 A96 96 0 0 1 436 100"/>
    </g>
  </g>
</svg>
