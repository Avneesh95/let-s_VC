<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161311"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="glyph" x1="90" y1="150" x2="422" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB8A3C"/>
      <stop offset="1" stop-color="#C2440A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Video call glyph: camera body (rounded rect) + lens flag (parallelogram),
       the universal "video camera" silhouette, oriented so the lens points
       right/outward like it's actively broadcasting -->
  <g>
    <rect x="90" y="176" width="230" height="160" rx="34" fill="url(#glyph)"/>
    <path d="M356 214 L430 172 C438.5 167.1 449 173.2 449 183 V329 C449 338.8 438.5 344.9 430 340 L356 298 Z" fill="url(#glyph)"/>
  </g>

  <!-- Signal / "live" pulse arcs, top-right of the lens — reinforces the
       "call/broadcast" idea rather than a plain still-camera read -->
  <g stroke="#FFB454" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M392 152 A64 64 0 0 1 428 128"/>
    <path d="M372 128 A96 96 0 0 1 436 100"/>
  </g>

  <!-- Subtle rim light for a premium, non-flat finish -->
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="4"/>
</svg>
