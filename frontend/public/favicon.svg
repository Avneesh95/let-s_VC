<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="peerlyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA733"/>
      <stop offset="50%" stop-color="#F4600F"/>
      <stop offset="100%" stop-color="#C2440A"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#F4600F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle / Capsule -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#peerlyGrad)" filter="url(#dropGlow)" />
  
  <!-- Subtle Inner Bevel Shine -->
  <rect x="32" y="32" width="448" height="224" rx="120" fill="url(#innerGlow)" />

  <!-- Overlapping Connected P2P Speech Bubbles / Nodes -->
  <g transform="translate(106, 116)">
    <!-- Primary Left Bubble -->
    <path d="M40 20 C17.9 20 0 37.9 0 60 L0 160 C0 182.1 17.9 200 40 200 L70 200 L70 250 L130 200 L180 200 C202.1 200 220 182.1 220 160 L220 60 C220 37.9 202.1 20 180 20 Z" fill="#FFFFFF" fill-opacity="0.95" />
    
    <!-- Video / Live Camera Indicator inside Left Bubble -->
    <circle cx="80" cy="110" r="22" fill="#F4600F" />
    <circle cx="140" cy="110" r="22" fill="#FFA733" />
    <rect x="80" y="96" width="60" height="28" fill="url(#peerlyGrad)" opacity="0.8" rx="4" />

    <!-- Secondary Right Bubble (Interlocking) -->
    <path d="M140 100 C140 85 152 72 168 72 L260 72 C276 72 290 85 290 100 L290 180 C290 195 276 208 260 208 L240 208 L210 240 L210 208 L168 208 C152 208 140 195 140 180 Z" fill="#FFA733" opacity="0.9" />
    <path d="M195 140 L245 110 L245 170 Z" fill="#FFFFFF" />
  </g>
</svg>
