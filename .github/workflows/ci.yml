name: Peerly CI & Automated Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-frontend:
    name: Frontend Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-app/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: chat-app/frontend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Build Frontend (Vite)
        run: npm run build

  test-backend:
    name: Backend API & Signaling Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-app/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: chat-app/backend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Run Backend Tests
        env:
          PORT: 5000
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_access_secret_key_12345
          JWT_REFRESH_SECRET: test_refresh_secret_key_12345
          CLIENT_URL: http://localhost:5173
        run: npm test
